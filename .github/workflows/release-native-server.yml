name: Release Native Server

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.30)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm --filter chrome-mcp-shared build

      - name: Build Chrome extension
        run: |
          cd app/chrome-extension
          pnpm build
          cd ../..
          mkdir -p releases
          tar -czf releases/mcp-chrome-plugin.tgz -C app/chrome-extension/.output/chrome-mv3 .

      - name: Pack pre-built bridge (Node.js tgz)
        run: pnpm --filter mcp-chrome-bridge pack:release

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: |
            releases/mcp-chrome-bridge.tgz
            releases/mcp-chrome-plugin.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
