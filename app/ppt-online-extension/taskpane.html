<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RGM Connector</title>
    <link rel="stylesheet" href="taskpane.css" />
    <script
      src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
      type="text/javascript"
    ></script>
  </head>
  <body>
    <div id="app">
      <div id="header">
        <span id="status-dot" class="dot disconnected"></span>
        <span id="status-text">Connecting…</span>
      </div>

      <div class="tab-nav">
        <button class="tab-btn active" data-tab="status">Status</button>
        <button class="tab-btn" data-tab="chat">Chat</button>
      </div>

      <div id="tab-status" class="tab-panel active">
        <div id="server-config">
          <label>Server URL</label>
          <input id="server-url" type="text" value="wss://localhost:12309" />
          <button id="btn-reconnect">Connect</button>
        </div>

        <div id="session-section">
          <label>Session ID</label>
          <div id="session-id"></div>
        </div>

        <div id="autostart-section">
          <label>Auto-start</label>
          <div id="autostart-row">
            <span id="autostart-status">checking…</span>
            <button id="btn-autostart">Enable</button>
          </div>
        </div>

        <div id="log-section">
          <div id="log-label">Last command</div>
          <pre id="log"></pre>
        </div>
      </div>

      <div id="tab-chat" class="tab-panel">
        <div id="chat-container"></div>
      </div>
    </div>
    <script src="executor-ppt.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="chat.js"></script>
    <script src="taskpane.js"></script>
  </body>
</html>
